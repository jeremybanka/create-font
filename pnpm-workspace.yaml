packages:
  - apps/*
  - packages/*
  - packages/*/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
enableGlobalVirtualStore: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - agents.yaml
  - atom.io
  - comline
  - lasertag
  - mondrian.pdf
  - treetrunks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    "lasertag>@types/react": 19.2.18
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
    vitest: "*"

catalog:
  "@vitest/coverage-v8": 5.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
