packages:
  - apps/*
  - packages/*
  - packages/*/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
enableGlobalVirtualStore: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - agents.yaml
  - atom.io
  - lasertag
  - mondrian.pdf
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    "lasertag>@types/react": 19.2.18
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
    vitest: "*"

catalog:
  "@vitest/coverage-v8": 4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.11

overrides:
  vite: "catalog:"
  vitest: "catalog:"
