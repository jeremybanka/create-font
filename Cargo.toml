[workspace]
members = [
	"crates/create-font-fea",
	"crates/create-font-fea-rs-wasm",
	"crates/dprint-plugin-fea",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/jeremybanka/create-font"
rust-version = "1.97.1"

[workspace.dependencies]
dprint-core = { version = "0.69.0", default-features = false }
fea-rs = "0.22.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
wasm-bindgen = "0.2.126"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
