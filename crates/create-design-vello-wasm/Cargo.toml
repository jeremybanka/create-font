[package]
name = "create-design-vello-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Vello Hybrid WebGL2 renderer bindings for Create Design"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
vello_common = { version = "0.2.0", default-features = false, features = [
	"std",
] }
vello_hybrid = { version = "0.2.0", default-features = false, features = [
	"webgl",
] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

[lints]
workspace = true
