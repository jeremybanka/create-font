name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-artifacts:
    name: Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: node-package-artifacts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'crates/**', 'scripts/build-dprint-plugin-fea.ts', 'scripts/build-fea-rs-wasm.ts') }}
          restore-keys: node-package-artifacts-${{ runner.os }}-
      - name: Verify Node test shard ownership
        run: node scripts/node-test-shards.ts verify
      - run: pnpm run build
      - name: Archive package artifacts
        run: >-
          tar -czf "$RUNNER_TEMP/node-package-artifacts.tgz"
          packages/*/dist
          packages/dprint-plugin-fea/plugin.wasm
          packages/dprint-plugin-fea/manifest.json
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-package-artifacts
          path: ${{ runner.temp }}/node-package-artifacts.tgz
          if-no-files-found: error
          retention-days: 1

  node-shared-foundations:
    name: Foundations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: node scripts/node-test-shards.ts shared-foundations

  node-feature-syntax-core:
    name: Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - name: Restore Rust test cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: node-feature-syntax-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'crates/**') }}
          restore-keys: node-feature-syntax-${{ runner.os }}-
      - run: node scripts/node-test-shards.ts feature-syntax-core

  node-source-formats:
    name: Source formats
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node scripts/node-test-shards.ts source-formats

  node-state-model:
    name: State
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: node scripts/node-test-shards.ts state-model

  node-editor:
    name: Editor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: node scripts/node-test-shards.ts editor

  node-design-application:
    name: Design
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node scripts/node-test-shards.ts design-application

  node-create-font-interfaces:
    name: Create Font
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node scripts/node-test-shards.ts create-font-interfaces

  node-create-font-source-pipeline:
    name: Font pipeline
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node scripts/node-test-shards.ts create-font-source-pipeline

  node-filesystem-integration:
    name: Filesystem
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node scripts/node-test-shards.ts filesystem-integration

  Bun:
    name: Bun compatibility
    needs: node-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/download-node-artifacts
      - run: node packages/create-font/scripts/build-development.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun --conditions=development
          packages/create-font/tests/runtime-server-smoke.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun packages/create-font/dist/font-cli.js
          build workbench-sans --root=.
