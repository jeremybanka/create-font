name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: node-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'crates/**', 'scripts/build-dprint-plugin-fea.ts', 'scripts/build-fea-rs-wasm.ts') }}
          restore-keys: |
            node-build-${{ runner.os }}-
            node-package-artifacts-${{ runner.os }}-
      - name: Verify Node test shard ownership
        run: node scripts/node-test-shards.ts verify
      - name: Build workspace
        run: pnpm run build

  node-shared-foundations:
    name: Foundations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - run: node scripts/node-test-shards.ts shared-foundations

  node-feature-syntax-core:
    name: Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - name: Restore Rust test cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: node-feature-syntax-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'crates/**') }}
          restore-keys: node-feature-syntax-${{ runner.os }}-
      - run: node scripts/node-test-shards.ts feature-syntax-core

  node-source-formats:
    name: Source formats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - run: node scripts/node-test-shards.ts source-formats

  node-state-model:
    name: State
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: node scripts/node-test-shards.ts state-model

  node-editor:
    name: Editor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - run: node scripts/node-test-shards.ts editor

  node-design-application:
    name: Design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - run: node scripts/node-test-shards.ts design-application

  node-create-font-interfaces:
    name: Create Font
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - name: Build Create Font packages
        run: pnpm --filter create-font... build
      - run: node scripts/node-test-shards.ts create-font-interfaces

  node-create-font-source-pipeline:
    name: Font pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - run: node scripts/node-test-shards.ts create-font-source-pipeline

  node-filesystem-integration:
    name: Filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - name: Build Font editor packages
        run: pnpm --filter @create-font/editor... build
      - run: node scripts/node-test-shards.ts filesystem-integration

  Bun:
    name: Bun compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-node-test-runtime
      - name: Build Create Font packages
        run: pnpm --filter create-font... build
      - run: node apps/create-font/scripts/build-development.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun --conditions=development
          apps/create-font/tests/runtime-server-smoke.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun apps/create-font/dist/font-cli.js
          build workbench-sans --root=.
