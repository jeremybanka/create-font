name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: pnpm run test

  Bun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: node packages/create-font/scripts/build-development.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun --conditions=development
          packages/create-font/tests/runtime-server-smoke.ts
      - run: >-
          mise exec bun@1.3.14 --
          bun packages/create-font/dist/font-cli.js
          build workbench-sans --root=.
