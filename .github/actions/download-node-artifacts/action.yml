name: Download Node package artifacts
description: Restore the package build produced by the Node artifact job.
runs:
  using: composite
  steps:
    - name: Download package archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-package-artifacts
        path: ${{ runner.temp }}/create-font-node-artifacts

    - name: Extract package archive
      shell: bash
      run: >-
        tar -xzf
        "$RUNNER_TEMP/create-font-node-artifacts/node-package-artifacts.tgz"
        -C "$GITHUB_WORKSPACE"
