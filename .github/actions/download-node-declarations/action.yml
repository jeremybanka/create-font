name: Download Node package declarations
description: Restore the declarations produced by the workspace build.
runs:
  using: composite
  steps:
    - name: Download declaration archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: node-package-declarations
        path: ${{ runner.temp }}/create-font-node-declarations

    - name: Extract declaration archive
      shell: bash
      run: >-
        tar -xzf
        "$RUNNER_TEMP/create-font-node-declarations/node-package-declarations.tgz"
        -C "$GITHUB_WORKSPACE"
